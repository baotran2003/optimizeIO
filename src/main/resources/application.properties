spring.application.name=optimizeIO

spring.datasource.url=jdbc:postgresql://localhost:5432/test_dualingo?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=123123tem
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Tắt show-sql để console không bị ngập lụt khi query 100k dòng

# Maximum connections trong pool
spring.datasource.hikari.maximum-pool-size=10

# Thời gian tối đa chờ mượn connection trước khi ném Exception (ms). VD 5thread sau cho 2000s < 2500 ko bi loi
spring.datasource.hikari.connection-timeout=2500

# Bật log chi tiết Pool để quan sát
spring.datasource.hikari.leak-detection-threshold=2500
logging.level.com.zaxxer.hikari=DEBUG
